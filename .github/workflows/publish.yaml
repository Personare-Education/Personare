name: Publish Release

on:
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both jobs attach to the same draft release; running them in parallel
      # could create two drafts for the same tag.
      max-parallel: 1
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-latest
          # macos-latest is Apple Silicon; the Intel build is cross-packaged.
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools rpm fakeroot dpkg

      - name: Install and build
        run: npm ci

      # Releases go to Personare-Education/personare-releases, which the
      # workflow's own GITHUB_TOKEN can't write to: RELEASES_TOKEN is a
      # fine-grained token with Contents read/write on that repo.
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npm run publish -- ${{ matrix.arch && format('--arch={0}', matrix.arch) || '' }}

      # The Claude Desktop extension (docs/specs/mcp-release.md AC-1): one file
      # for every system, so only the Linux job attaches it. The draft has no
      # tag yet, so it is found by its tag name through the API; an asset left
      # by an earlier run is replaced.
      - name: Attach the MCP extension
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          npm run build:mcp
          version=$(node -p "require('./package.json').version")
          name="personare-${version}.mcpb"
          repo="Personare-Education/personare-releases"
          releases_jq=".[] | select(.draft and .tag_name == \"v${version}\") | .id"
          release_id=$(gh api "repos/$repo/releases" --paginate --jq "$releases_jq" | head -n1)
          if [ -z "$release_id" ]; then
            echo "No draft release v${version} in $repo" >&2
            exit 1
          fi
          assets_jq=".[] | select(.name == \"$name\") | .id"
          for asset_id in $(gh api "repos/$repo/releases/$release_id/assets" --jq "$assets_jq"); do
            gh api --method DELETE "repos/$repo/releases/assets/$asset_id"
          done
          upload_url="https://uploads.github.com/repos/$repo/releases/$release_id/assets?name=$name"
          gh api --method POST -H "Content-Type: application/octet-stream" "$upload_url" --input out/mcp/personare.mcpb > /dev/null
          echo "Attached $name to the draft v${version}"
